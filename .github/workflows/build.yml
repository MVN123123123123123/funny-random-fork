name: Build Installer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libncurses5-dev libncursesw5-dev
        
    - name: Build Installer
      run: |
        chmod +x build.sh
        ./build.sh cmake
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: haruka_installer
        path: build/haruka_installer
        
    - name: Publish to Latest Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        prerelease: true
        files: build/haruka_installer
